<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title data-i18n="ui.httpauthhtml.text6e8f67f5b3">HTTP authentication</title><link rel="stylesheet" href="pages.css"></head>
<body><main><h1><span data-i18n="ui.httpauthhtml.text22fa074241">Sign in to this site</span></h1><p id="origin"></p><p id="realm"></p>
<form><p><label><span data-i18n="ui.httpauthhtml.textf9e7d49e47">Username</span> <input id="username" autocomplete="username" maxlength="1024" required autofocus></label></p>
<p><label><span data-i18n="settings.proxyPassword">Password</span> <input id="password" type="password" autocomplete="current-password" maxlength="4096"></label></p>
<button type="submit"><span data-i18n="ui.httpauthhtml.text0ac3d2cb30">Sign in</span></button></form><p><span data-i18n="ui.httpauthhtml.text1c659f4c6c">Closing this window cancels sign-in. Credentials are not saved.</span></p></main></body></html>
