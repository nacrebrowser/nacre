<body><header><a href="nacre://settings/" data-i18n="siteControls.back">← Settings</a><span data-i18n="siteControls.eyebrow">SITE PRIVACY</span></header><main><p class="eyebrow" data-i18n="siteControls.eyebrow">SITE PRIVACY</p><h1 data-i18n="siteControls.title">Site permissions</h1><p class="lead" data-i18n="siteControls.intro">Access is denied by default. Temporary decisions expire on navigation and are never saved.</p><div class="actions"><button id="refresh" data-i18n="siteControls.refresh">Refresh</button><button id="reset-all" class="danger" data-i18n="siteControls.resetAll">Reset all permissions</button></div><p id="status" role="status"></p><section id="sites"></section><p class="note" data-i18n="siteControls.storageNote">Normal persistent decisions are saved locally. Private decisions stay in memory.</p></main><script src="sites.js"></script></body></html>
