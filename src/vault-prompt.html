<!doctype html><html lang="en"><head><meta charset="utf-8"><meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self'; base-uri 'none'; form-action 'none'"><title data-i18n="privacyCheck.prompt390e30812b">Nacre settings vault</title><link rel="stylesheet" href="vault-prompt.css"></head><body><h1><span data-i18n="privacyCheck.prompt219a304c0f">Settings vault</span></h1><p id="message"></p><p><span data-i18n="privacyCheck.promptf8a79d5256">Protects saved settings and bookmarks. Cookies, site storage, downloads and older backups are outside this vault. There is no password recovery.</span></p><form><label><span data-i18n="privacyCheck.promptbe21410f73">Primary password</span><input id="password" type="password" maxlength="1024" autocomplete="current-password" required autofocus></label><label id="confirmation" hidden><span data-i18n="privacyCheck.prompt5ac265f396">Confirm password</span><input id="repeat" type="password" maxlength="1024" autocomplete="new-password"></label><p id="error" role="alert"></p><button type="submit"><span data-i18n="privacyCheck.prompt31fbef1625">Continue</span></button><button id="cancel" type="button"><span data-i18n="privacyCheck.prompt19766ed6cc">Cancel</span></button></form><script src="vault-prompt.js"></script></body></html>
